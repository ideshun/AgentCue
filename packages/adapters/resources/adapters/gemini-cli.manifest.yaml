id: gemini-cli
name: Gemini CLI
sessionCapability: detect-only
capabilityReason: '安装识别与任务事件接入分别显示；配置接入后运行新任务验证。'
detect:
  configPaths:
    - mac: '~/.gemini'
      win: '%USERPROFILE%/.gemini'
      linux: '~/.gemini'
  processNames: ['gemini']
  apis: []
sessionSource:
  type: none
heartbeat: { intervalSec: 60, probe: file_mtime }
eventMapping: {}
