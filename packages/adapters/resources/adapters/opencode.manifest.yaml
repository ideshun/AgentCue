id: opencode
name: OpenCode
sessionCapability: detect-only
capabilityReason: '安装识别与任务事件接入分别显示；配置接入后运行新任务验证。'
detect:
  configPaths:
    - mac: '~/.config/opencode'
      win: '%USERPROFILE%/.config/opencode'
      linux: '~/.config/opencode'
  processNames: ['opencode']
  apis: []
sessionSource:
  type: none
heartbeat: { intervalSec: 60, probe: file_mtime }
eventMapping: {}
