id: qwen-code
name: Qwen Code
sessionCapability: detect-only
capabilityReason: '安装识别与任务事件接入分别显示；配置接入后运行新任务验证。'
detect:
  configPaths:
    - mac: '~/.qwen'
      win: '%USERPROFILE%/.qwen'
      linux: '~/.qwen'
  processNames: ['qwen']
  apis: []
sessionSource:
  type: none
heartbeat: { intervalSec: 60, probe: file_mtime }
eventMapping: {}
