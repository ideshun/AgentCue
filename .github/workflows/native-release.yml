name: Native release

on:
  push:
    tags: ['v1.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: mac-arm64
            bundles: app,dmg
          - runner: macos-15-intel
            name: mac-x64
            bundles: app,dmg
          - runner: windows-2022
            name: windows-x64
            bundles: nsis
          - runner: ubuntu-24.04
            name: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "v$(node -p 'require("./apps/tauri/tauri.conf.json").version')" = "$RELEASE_TAG"
          test -s "docs/releases/$RELEASE_TAG.md"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: sh scripts/rust-verify.sh
      - name: Build native installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm tauri:bundle "${{ matrix.bundles }}"
      - name: Check native code and the inference worker
        run: |
          cargo clippy -p agentcue-desktop -p agentcue-tts --all-targets --features agentcue-desktop/custom-protocol --locked -- -D warnings
          cargo test -p agentcue-tts --locked
      - name: Verify packaged macOS executable and sidecar
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict target/release/bundle/macos/AgentCue.app
          target/release/bundle/macos/AgentCue.app/Contents/MacOS/AgentCue --self-test
      - name: Verify staged Windows executable and sidecar
        if: runner.os == 'Windows'
        run: target/release/AgentCue.exe --self-test
      - name: Verify Debian and AppImage executable and sidecar
        if: runner.os == 'Linux'
        run: |
          install_dir=$(mktemp -d)
          dpkg-deb --extract target/release/bundle/deb/*.deb "$install_dir"
          "$install_dir/usr/bin/AgentCue" --self-test
          installer=$(realpath target/release/bundle/appimage/*.AppImage)
          cd "$install_dir"
          "$installer" --appimage-extract >/dev/null
          ./squashfs-root/AppRun --self-test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-installers-${{ matrix.name }}
          if-no-files-found: error
          compression-level: 0
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-installers-*
          merge-multiple: true
          path: release-assets
      - run: node scripts/release.mjs checksums release-assets
      - name: Prepare GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/native-release-is-draft; then
            test "$(cat /tmp/native-release-is-draft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "AgentCue $RELEASE_TAG · Preview" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
