<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: http://127.0.0.1:*; connect-src http://127.0.0.1:*"
    />
    <title>AgentCue</title>
    <link rel="icon" type="image/png" href="./assets/brand/brand-mark.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./office.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img
              src="./assets/brand/brand-mark.png"
              srcset="./assets/brand/brand-mark@2x.png 2x"
              width="32"
              height="32"
              alt=""
            />
          </span>
          <div class="brand-text">
            <strong>AgentCue</strong>
            <span>AI 任务监控与提醒</span>
          </div>
        </div>

        <nav class="nav" id="nav" aria-label="主导航">
          <div class="nav-group">
            <p class="nav-group-label">监控</p>
            <button class="nav-item" data-route="overview">
              <span class="nav-icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 22 22"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="3" width="6" height="7" rx="1" />
                  <rect x="13" y="3" width="6" height="4" rx="1" />
                  <rect x="3" y="14" width="6" height="5" rx="1" />
                  <rect x="13" y="11" width="6" height="8" rx="1" /></svg></span
              >总览
            </button>
            <button class="nav-item" data-route="office">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="10" height="7" rx="1.5" /><path d="M11 10v3M8 13h6M3 14h16M4 14v5M18 14v5" /></svg></span>办公室
            </button>
            <button class="nav-item" data-route="board">
              <span class="nav-icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 22 22"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="16" height="15" rx="2" />
                  <path d="M8.3 4v15M13.7 4v15" /></svg></span
              >任务看板
            </button>
            <button class="nav-item" data-route="notifications">
              <span class="nav-icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 22 22"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 15V9a6 6 0 0 1 12 0v6l2 2H3l2-2Z" />
                  <path d="M9 20h4" /></svg></span
              >通知中心<span id="nav-notice-badge" class="nav-badge" hidden></span>
            </button>
          </div>

          <div class="nav-group">
            <p class="nav-group-label">接入</p>
            <button class="nav-item" data-route="integrations">
              <span class="nav-icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 22 22"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M8 8 5 11l3 3M14 8l3 3-3 3M12 5l-2 12" />
                  <rect x="2" y="2" width="18" height="18" rx="4" /></svg></span
              >播报接入
            </button>
            <button class="nav-item" data-route="adapters">
              <span class="nav-icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 22 22"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="4" y="4" width="14" height="14" rx="3" />
                  <path d="M8 1v3M14 1v3M8 18v3M14 18v3M1 8h3M18 8h3M1 14h3M18 14h3" />
                  <rect x="8" y="8" width="6" height="6" rx="1" /></svg></span
              >工具与扩展
            </button>
          </div>

          <div class="nav-group">
            <p class="nav-group-label">配置</p>
            <button class="nav-item" data-route="settings">
              <span class="nav-icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 22 22"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 6h14M4 11h14M4 16h14" />
                  <circle cx="8" cy="6" r="2" fill="currentColor" stroke="none" />
                  <circle cx="14" cy="11" r="2" fill="currentColor" stroke="none" />
                  <circle cx="9" cy="16" r="2" fill="currentColor" stroke="none" /></svg></span
              >设置
            </button>
          </div>
        </nav>

        <div class="rail-footer">
          <div class="engine-status">
            <span class="engine-dot" aria-hidden="true"></span>
            <p id="runtime-hint" class="hint">正在连接本地引擎…</p>
          </div>
          <button id="mute-toggle" class="mute-btn" type="button">静音自动播报</button>
        </div>
      </aside>

      <main class="main">
        <header class="pagehead" id="topbar">
          <div class="pagehead-title">
            <h1 id="page-title">总览</h1>
            <p id="page-subtitle">正在加载…</p>
          </div>
          <div class="pagehead-actions">
            <button
              id="btn-refresh"
              class="btn btn-ghost"
              type="button"
              title="重新读取任务状态与通知"
            >
              刷新
            </button>
            <button
              id="btn-scan"
              class="btn btn-primary"
              type="button"
              title="扫描本机工具的安装清单；任务状态每 5 秒自动采集"
            >
              扫描工具
            </button>
          </div>
        </header>

        <section id="view" class="view" tabindex="-1">
          <div class="empty">正在启动…</div>
        </section>
      </main>
    </div>

    <div id="drawer" class="drawer" hidden>
      <div class="drawer-backdrop" data-close="true"></div>
      <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header class="drawer-head">
          <div>
            <h2 id="drawer-title">任务时间线</h2>
            <p id="drawer-subtitle" class="muted"></p>
          </div>
          <button class="icon-btn" type="button" data-close="true" aria-label="关闭">×</button>
        </header>
        <div id="drawer-body" class="drawer-body"></div>
      </aside>
    </div>

    <div id="confirm" class="modal" hidden>
      <div class="drawer-backdrop" data-confirm="cancel"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title"></h2>
        <p id="confirm-body" class="muted"></p>
        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" data-confirm="cancel"></button>
          <button class="btn btn-ghost" type="button" data-confirm="discard"></button>
          <button class="btn btn-primary" type="button" data-confirm="save"></button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="./api.js"></script>
    <script src="./ui.js"></script>
    <script src="./views.js"></script>
    <script src="./office.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
