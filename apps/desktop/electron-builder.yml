appId: com.awm.app
productName: AgentCue
copyright: Copyright © 2026
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
compression: maximum
# 显式固定版本：electron-builder 无法从 "^x.y.z" 范围解析平台二进制版本
electronVersion: 44.9.0
# Keep only Electron's English and Chinese UI resources. Chromium ships more
# than 200 locale bundles; the app itself is zh-CN with an English fallback.
# Include underscore spellings used by macOS .lproj folders and hyphen
# spellings used by Windows/Linux .pak files.
electronLanguages:
  - en
  - en-US
  - en-GB
  - en_GB
  - en_FEMININE
  - en_MASCULINE
  - en_NEUTER
  - en_GB_FEMININE
  - en_GB_MASCULINE
  - en_GB_NEUTER
  - zh-CN
  - zh-TW
  - zh-HK
  - zh_CN
  - zh_CN_FEMININE
  - zh_CN_MASCULINE
  - zh_CN_NEUTER
  - zh_TW
  - zh_TW_FEMININE
  - zh_TW_MASCULINE
  - zh_TW_NEUTER
directories:
  output: release
files:
  # 显式列出 node_modules：一旦声明 files，默认 patterns 即被整体替换，
  # 不写这条会把生产依赖全部漏掉，打出来的包装完即崩（找不到 @awm/core）。
  - dist/**/*
  - package.json
  - node_modules/**/*
  # 剔除无需进入安装包的开发期文件，缩小包体
  - '!node_modules/**/{README,readme,CHANGELOG,HISTORY,CONTRIBUTING}*'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.map'
  - '!node_modules/**/test/**'
  - '!**/*.test.js'
  - '!**/*.{iml,o,hpro,ts,js.map}'
  # 仅保留 SQLite 的 JS 与编译完成的 .node，不分发编译源码和中间文件。
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/build/Release/obj/**'
  - '!node_modules/better-sqlite3/build/Release/obj.target/**'
  - '!node_modules/better-sqlite3/build/Release/.deps/**'
  - '!node_modules/**/*.{c,cc,cpp,h,hpp,gyp,gypi,a,pdb}'
  # 本地 TTS 统一由 afterPack 复制到 Resources/sherpa-tts，避免重复打包。
  - '!node_modules/sherpa-onnx*/**/*'
# workspace 使用 hoisted node_modules，打包前端口未必包含根目录直接依赖。
# afterPack 按目标架构把 sherpa JS 包与对应原生运行时复制到 Resources/sherpa-tts。
afterPack: scripts/after-pack.cjs
# better-sqlite3 是原生模块，asar 内无法 require .node，必须解包到磁盘。
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
mac:
  icon: build/icon.icns
  category: public.app.category.developer-tools
  darkModeSupport: true
  # 公证需要 Apple 账号与 CSC_* / APPLE_ID；未配置时只出未签名内测包
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
win:
  icon: build/icon.ico
  # 代码签名需要 CSC_LINK / CSC_KEY_PASSWORD；未配置时仍可打内测 NSIS 包
  target:
    - target: nsis
linux:
  executableName: agentcue
  icon: src/renderer/assets/brand/app-icon.png
  # AppImage 默认不签名；发行渠道需要时自行配置 GPG
  target:
    - target: AppImage
