[workspace]
members = ["crates/agentcue-core", "crates/agentcue-store", "crates/agentcue-runtime", "crates/agentcue-adapters", "crates/agentcue-tts", "apps/tauri"]
resolver = "3"

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ideshun/AgentCue"

[profile.release]
lto = "thin"
strip = "symbols"
