[package]
name = "agentcue-runtime"
description = "AgentCue native monitoring and control runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
agentcue-adapters = { path = "../agentcue-adapters" }
agentcue-core = { path = "../agentcue-core" }
agentcue-store = { path = "../agentcue-store" }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
glob = "0.3"
regex = "1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

base64 = "0.22"
subtle = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
